appId: com.circe.desktop
productName: Circe
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
extraResources:
  - from: out/resources
    to: resources
mac:
  category: public.app-category.productivity
  target: [dmg]
  icon: resources/icon-v4.png
  identity: null
win:
  target: [nsis]
  icon: resources/icon-v4.png
  artifactName: 'Circe-${version}-windows-${arch}-setup.${ext}'
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
linux:
  target: [AppImage]
  category: Utility
  icon: resources/icon-v4.png
