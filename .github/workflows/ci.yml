name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Expected to fail until Task 16 adds playwright.config.ts and the E2E
      # suite — Task 16 will remove this comment once that lands.
      - run: npm run test:e2e
        env:
          CIRCE_E2E: '1'
