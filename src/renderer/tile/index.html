<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>Circe</title>
    <link rel="stylesheet" href="./tile.css" />
  </head>
  <body>
    <!-- The card, not the window, carries the colour. `body` stays transparent
         so the shadow has somewhere to fall and the rounded corners actually
         read as corners — a tile has to look like an object sitting on the
         desktop, not like a rectangle painted over it. -->
    <div class="tile">
      <!-- No close button of our own: the window carries macOS's real
           close/minimise/zoom at the top left (`titleBarStyle: 'hiddenInset'`),
           and the card's top padding is the room they sit in. -->
      <header id="bar"><button id="face" class="avatar" type="button" title="Replace avatar" aria-label="Replace avatar"></button><div class="agent-identity"><span id="who"></span><span id="model" title="Waiting for Hermes to report the conversation model">Connecting…</span></div></header>
      <div id="orchestrator-help" hidden>
        <button
          id="orchestrator-help-trigger"
          type="button"
          aria-label="About your orchestrator"
          aria-describedby="orchestrator-help-tooltip"
        >?</button>
        <div id="orchestrator-help-tooltip" role="tooltip">
          <ol>
            <li>Your orchestrator is here to help you, and will suggest spinning up a new agent when needed.</li>
            <li>It can also help you fix your other agents if something isn't working.</li>
            <li>Be patient! This is a system that learns, so if it's doing something wrong, let it know!</li>
          </ol>
        </div>
      </div>
      <nav id="tabs" aria-label="Conversations" hidden>
        <button id="tabs-left" class="tab-scroll" type="button" aria-label="Scroll tabs left" aria-controls="tab-list" title="Scroll tabs left" hidden disabled>‹</button>
        <div id="tab-list" role="tablist"></div>
        <button id="tabs-right" class="tab-scroll" type="button" aria-label="Scroll tabs right" aria-controls="tab-list" title="Scroll tabs right" hidden disabled>›</button>
        <button id="new-tab" type="button" aria-label="New conversation" title="New conversation">+</button>
      </nav>
      <section id="context-health" class="normal" hidden>
        <div class="context-health-summary">
          <span id="context-health-label">Context</span>
          <span id="context-health-value"></span>
        </div>
        <div class="context-health-track" aria-hidden="true"><span id="context-health-fill"></span></div>
        <div id="context-health-advice" role="status" aria-live="polite" hidden>
          <span id="context-health-message"></span>
          <button id="handoff" type="button" hidden>Start fresh with handoff</button>
        </div>
      </section>
      <div id="log"></div>
      <div id="permissions" aria-label="Tool approvals" aria-live="polite"></div>
      <footer>
        <textarea id="input" rows="1" placeholder="Message…"></textarea>
        <button id="send" type="button">Send</button>
      </footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
